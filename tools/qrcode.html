<!DOCTYPE html>
<html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Code</title>

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
textarea { width: 100%; min-height: 120px; margin-bottom: 10px; resize: none; overflow: hidden; }
button { padding: 8px 12px; margin-right: 6px; }
#qrcode { margin-top: 15px; }
  </style>

  
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.js"></script>
<textarea id="text" placeholder="Pega aquí el texto del portapapeles..."></textarea>
<br>

  <button onclick="pasteClipboard()">Pegar</button>
  <button onclick="makeCode()">Generar QR</button>

<div id="qrcode"></div>

  <script>
    var qrcode = new QRCode("qrcode");

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    function makeCode () {
      var elText = document.getElementById("text");

      if (!elText.value.trim()) {
        alert("Input a text");
        elText.focus();
        return;
      }

      qrcode.makeCode(elText.value);
    }

    async function pasteClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        const el = document.getElementById("text");
        el.value = text;
        autoResize(el);
      } catch (e) {
        alert("No se pudo leer el portapapeles");
      }
    }

    // resize while typing
    document.getElementById("text").addEventListener("input", function () {
      autoResize(this);
    });
  </script>
</body>
</html>
